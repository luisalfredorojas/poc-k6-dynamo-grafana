apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-api-gateway
  namespace: grafana             # ajusta al namespace donde corre Grafana
  labels:
    app: k6-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6-api-gateway
  template:
    metadata:
      labels:
        app: k6-api-gateway
    spec:
      serviceAccountName: k6-api-gateway
      containers:
        - name: api-gateway
          # Reemplaza con tu URI de ECR:
          # ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/k6-api-gateway:latest
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/k6-api-gateway:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: AWS_REGION
              value: "us-east-1"             # ajusta tu región
            # Solo necesitas estas variables si NO usas IRSA.
            # Si usas IRSA (recomendado), elimina este bloque.
            # - name: AWS_ACCESS_KEY_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: k6-aws-credentials
            #       key: access-key-id
            # - name: AWS_SECRET_ACCESS_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: k6-aws-credentials
            #       key: secret-access-key
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: k6-api-gateway
  namespace: grafana
spec:
  selector:
    app: k6-api-gateway
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
---
# ServiceAccount con IRSA: el pod hereda permisos de DynamoDB desde un IAM Role
# sin necesidad de guardar access keys en el cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6-api-gateway
  namespace: grafana
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/k6-api-gateway-role
